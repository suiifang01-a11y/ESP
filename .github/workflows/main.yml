name: Ubuntu Tailscale SSH

on:
  workflow_dispatch:
    inputs:
      tailscale_auth_key:
        description: "Tailscale Auth Key"
        required: true
        type: string

      ssh_public_key:
        description: "SSH Public Key dari Termux"
        required: true
        type: string

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Setup SSH + Tailscale
        env:
          TS_AUTHKEY: ${{ inputs.tailscale_auth_key }}
          SSH_PUBKEY: ${{ inputs.ssh_public_key }}

        run: |
          echo "::add-mask::$TS_AUTHKEY"

          echo "=== Install SSH ==="
          sudo apt-get update
          sudo apt-get install -y openssh-server curl

          sudo systemctl enable ssh
          sudo systemctl start ssh

          echo "=== Setup SSH Key ==="
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$SSH_PUBKEY" >> "$HOME/.ssh/authorized_keys"

          chmod 600 "$HOME/.ssh/authorized_keys"

          echo "=== Install Tailscale ==="
          curl -fsSL https://tailscale.com/install.sh | sh

          echo "=== Connect Tailscale ==="
          sudo tailscale up \
            --authkey="$TS_AUTHKEY" \
            --hostname="github-runner-${GITHUB_RUN_ID}"

          sleep 3

          IP=$(tailscale ip -4)
          USERNAME=$(whoami)

          echo ""
          echo "================================"
          echo "   SSH CONNECTION INFORMATION"
          echo "================================"
          echo "User : $USERNAME"
          echo "IP   : $IP"
          echo "Port : 22"
          echo ""
          echo "Termux:"
          echo "ssh -i ~/.ssh/gha_ed25519 $USERNAME@$IP"
          echo "================================"

      - name: Keep Runner Alive
        run: |
          echo "Runner aktif."
          echo "Jangan stop workflow kalau masih mau SSH."
          sleep 21000
