name: RDP + Tailscale (Ubuntu)

on:
  workflow_dispatch:
    inputs:
      ts_authkey:
        description: "Tailscale Auth key (tskey-auth-...)"
        required: true
      ts_api_key:
        description: "Tailscale API key (untuk purge device lama)"
        required: true
      ts_tailnet:
        description: "Tailscale tailnet (e.g. you@gmail.com)"
        required: true
      do_purge:
        description: "Purge device bullet* lama di Tailscale sebelum mulai"
        required: false
        default: "true"
      quick_test:
        description: "Mode test 5 menit"
        type: boolean
        default: false
      runtime_minutes:
        description: "Durasi session (maks 355)"
        required: false
        default: "355"
      rdp_count:
        description: "Jumlah instance RDP (1-10)"
        required: false
        default: "1"
      cycles:
        description: "0=stop setelah run ini; N=jumlah handoff tersisa"
        required: false
        default: "0"

permissions:
  contents: read
  actions: write

defaults:
  run:
    shell: bash

jobs:
  setup:
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.mk.outputs.matrix }}
      multi: ${{ steps.mk.outputs.multi }}

    steps:
      - id: mk
        run: |
          N=${{ inputs.rdp_count }}

          [[ "$N" -lt 1 ]] 2>/dev/null && N=1
          [[ "$N" -gt 10 ]] 2>/dev/null && N=10

          INCLUDE="["

          for i in $(seq 1 "$N"); do
            [[ $i -gt 1 ]] && INCLUDE="${INCLUDE},"
            INCLUDE="${INCLUDE}{\"id\":$i}"
          done

          INCLUDE="${INCLUDE}]"

          echo "matrix={\"include\":${INCLUDE}}" >> "$GITHUB_OUTPUT"

          if [[ "$N" -gt 1 ]]; then
            echo "multi=1" >> "$GITHUB_OUTPUT"
          else
            echo "multi=0" >> "$GITHUB_OUTPUT"
          fi

  rdp:
    needs: setup
    runs-on: ubuntu-latest

    strategy:
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
      max-parallel: 10

    timeout-minutes: 370

    env:
      RDP_USER: Bullettemporary
      RDP_PASS: Bullet@12345
      DEBIAN_FRONTEND: noninteractive

      STARTWM_B64: 

      PKLA_B64: 

    steps:
      - name: Set hostname + runtime
        run: |
          N="${{ inputs.rdp_count }}"

          if [[ "$N" -gt 1 ]] 2>/dev/null; then
            HN="bullet${{ matrix.id }}"
          else
            HN="bullet"
          fi

          echo "TS_HOSTNAME=$HN" >> "$GITHUB_ENV"

          RT="${{ inputs.runtime_minutes }}"

          [[ "${{ inputs.quick_test }}" == "true" ]] && RT=5
          [[ ! "$RT" =~ ^[0-9]+$ ]] && RT=355
          [[ "$RT" -lt 6 ]] && RT=355
          [[ "$RT" -gt 355 ]] && RT=355

          echo "RUNTIME_MINUTES=$RT" >> "$GITHUB_ENV"

          echo "Hostname: $HN | Runtime: $RT min"

      - name: Install dependencies
        run: |
          sudo apt-get update -y

          sudo apt-get install -y \
            xrdp \
            xfce4 \
            xfce4-terminal \
            xfce4-session \
            xfce4-goodies \
            xfconf \
            dbus-x11 \
            dbus-user-session \
            ufw \
            curl \
            wget \
            python3

      - name: Configure xrdp + xfce4
        run: |
          echo "$STARTWM_B64" | base64 -d | \
            sudo tee /etc/xrdp/startwm.sh > /dev/null

          sudo chmod +x /etc/xrdp/startwm.sh

          echo 'allowed_users=anybody' | \
            sudo tee /etc/X11/Xwrapper.config > /dev/null

          sudo mkdir -p /etc/polkit-1/localauthority/50-local.d/

          echo "$PKLA_B64" | base64 -d | \
            sudo tee /etc/polkit-1/localauthority/50-local.d/xrdp-allow.pkla > /dev/null

          sudo systemctl enable xrdp
          sudo systemctl restart xrdp

      - name: Create RDP user
        run: |
          U="$RDP_USER"
          P="$RDP_PASS"

          if ! id "$U" &>/dev/null; then
            sudo useradd -m -s /bin/bash "$U"
          fi

          echo "$U:$P" | sudo chpasswd

          sudo usermod -aG sudo,xrdp "$U"

          echo "$STARTWM_B64" | base64 -d | \
            sudo tee "/home/$U/.xsession" > /dev/null

          sudo chmod +x "/home/$U/.xsession"
          sudo chown "$U:$U" "/home/$U/.xsession"

          echo "RDP user: $U"

      - name: Open RDP port
        run: |
          sudo ufw allow 3389/tcp || true
          echo "Port 3389 opened."

      - name: Purge old Tailscale devices
        if: ${{ needs.setup.outputs.multi == '0' && inputs.do_purge == 'true' }}
        run: |
          AUTH=$(echo -n "${{ inputs.ts_api_key }}:" | base64 -w0)

          TN=$(python3 -c \
            "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" \
            "${{ inputs.ts_tailnet }}")

          DEVICES=$(curl -sf \
            -H "Authorization: Basic $AUTH" \
            "https://api.tailscale.com/api/v2/tailnet/$TN/devices") || {
              echo "Warning: gagal fetch devices. Skip purge."
              exit 0
            }

          python3 << PYEOF
          import json
          import urllib.request

          auth = "$AUTH"
          data = json.loads("""$DEVICES""")

          for d in data.get("devices", []):
              hostname = d.get("hostname", "")

              if hostname.startswith("bullet"):
                  req = urllib.request.Request(
                      f"https://api.tailscale.com/api/v2/device/{d['id']}",
                      method="DELETE",
                      headers={
                          "Authorization": f"Basic {auth}"
                      }
                  )

                  try:
                      urllib.request.urlopen(req)
                      print(f"Deleted: {hostname}")
                  except Exception as e:
                      print(f"Warn: {e}")

          PYEOF

          echo "Purge selesai."

      - name: Install + connect Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sudo sh

          sudo tailscale logout 2>/dev/null || true

          sudo tailscale up \
            --authkey="${{ inputs.ts_authkey }}" \
            --hostname="$TS_HOSTNAME" \
            --accept-dns=true \
            --accept-routes=true \
            --ssh

          IP4=$(sudo tailscale ip -4 2>/dev/null | head -1)

          echo "TAILSCALE_IP=$IP4" >> "$GITHUB_ENV"

          echo "══════════════════════════════════════"
          echo "  RDP  : $IP4:3389"
          echo "  USER : $RDP_USER"
          echo "  PASS : $RDP_PASS"
          echo "══════════════════════════════════════"

      - name: Keep alive
        run: |
          END=$((SECONDS + RUNTIME_MINUTES * 60))

          while [ $SECONDS -lt $END ]; do
            REMAIN=$(( (END - SECONDS) / 60 ))

            echo "[RDP] $(date +%H:%M:%S) | sisa: ${REMAIN} menit | ${TAILSCALE_IP}:3389"

            sleep 60
          done

      - name: Dispatch next or stop
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}

        run: |
          CYCLES="${{ inputs.cycles }}"

          [[ ! "$CYCLES" =~ ^[0-9]+$ ]] && CYCLES=0

          if [[ "$CYCLES" -gt 0 ]]; then
            NEXT=$((CYCLES - 1))
            REPO="${{ github.repository }}"
            REF="${{ github.ref_name }}"

            if [[ "$NEXT" -le 0 ]]; then
              curl -sf -X POST \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -d "{\"ref\":\"$REF\",\"inputs\":{\"ts_tailnet\":\"${{ inputs.ts_tailnet }}\",\"ts_api_key\":\"${{ inputs.ts_api_key }}\",\"base_prefix\":\"bullet\",\"max_count\":\"10\",\"dry_run\":\"false\"}}" \
                "https://api.github.com/repos/$REPO/actions/workflows/rdp-tailscale-stop.yml/dispatches"

              echo "Dispatched STOP."

            else
              PAYLOAD=$(python3 -c \
                "import json; print(json.dumps({
                  'ts_authkey':'${{ inputs.ts_authkey }}',
                  'ts_api_key':'${{ inputs.ts_api_key }}',
                  'ts_tailnet':'${{ inputs.ts_tailnet }}',
                  'do_purge':'${{ inputs.do_purge }}',
                  'quick_test':'${{ inputs.quick_test }}',
                  'runtime_minutes':'${{ inputs.runtime_minutes }}',
                  'rdp_count':'${{ inputs.rdp_count }}',
                  'cycles':str($NEXT)
                }))")

              curl -sf -X POST \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -d "{\"ref\":\"$REF\",\"inputs\":$PAYLOAD}" \
                "https://api.github.com/repos/$REPO/actions/workflows/rdp-tailscale-ubuntu-clean.yml/dispatches"

              echo "Dispatched next, cycles=$NEXT"
            fi
          else
            echo "cycles=0, session selesai."
          fi
