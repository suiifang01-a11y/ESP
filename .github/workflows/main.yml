name: RDP + Tailscale (Ubuntu)

on:
  workflow_dispatch:
    inputs:
      ts_authkey:
        description: "Tailscale Auth key (tskey-auth-...)"
        required: true
      ts_api_key:
        description: "Tailscale API key"
        required: true
      ts_tailnet:
        description: "Tailscale tailnet"
        required: true
      do_purge:
        description: "Purge device bullet lama"
        required: false
        default: "true"
      quick_test:
        description: "Mode test 5 menit"
        type: boolean
        default: false
      runtime_minutes:
        description: "Durasi session (maks 355)"
        required: false
        default: "355"
      rdp_count:
        description: "Jumlah instance RDP (1-10)"
        required: false
        default: "1"
      cycles:
        description: "Jumlah handoff tersisa"
        required: false
        default: "0"

permissions:
  contents: read
  actions: write

defaults:
  run:
    shell: bash

jobs:
  setup:
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.mk.outputs.matrix }}
      multi: ${{ steps.mk.outputs.multi }}

    steps:
      - id: mk
        run: |
          N="${{ inputs.rdp_count }}"

          [[ "$N" =~ ^[0-9]+$ ]] || N=1
          [[ "$N" -lt 1 ]] && N=1
          [[ "$N" -gt 10 ]] && N=10

          INCLUDE="["

          for i in $(seq 1 "$N"); do
            [[ "$i" -gt 1 ]] && INCLUDE+=","
            INCLUDE+="{\"id\":$i}"
          done

          INCLUDE+="]"

          echo "matrix={\"include\":${INCLUDE}}" >> "$GITHUB_OUTPUT"

          if [[ "$N" -gt 1 ]]; then
            echo "multi=1" >> "$GITHUB_OUTPUT"
          else
            echo "multi=0" >> "$GITHUB_OUTPUT"
          fi

  rdp:
    needs: setup

    runs-on: ubuntu-latest

    strategy:
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
      max-parallel: 10

    timeout-minutes: 370

    env:
      RDP_USER: Bullettemporary
      RDP_PASS: Bullet@12345
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Set hostname + runtime
        run: |
          N="${{ inputs.rdp_count }}"

          if [[ "$N" -gt 1 ]]; then
            HN="bullet${{ matrix.id }}"
          else
            HN="bullet"
          fi

          echo "TS_HOSTNAME=$HN" >> "$GITHUB_ENV"

          RT="${{ inputs.runtime_minutes }}"

          if [[ "${{ inputs.quick_test }}" == "true" ]]; then
            RT=5
          fi

          [[ "$RT" =~ ^[0-9]+$ ]] || RT=355
          [[ "$RT" -lt 5 ]] && RT=5
          [[ "$RT" -gt 355 ]] && RT=355

          echo "RUNTIME_MINUTES=$RT" >> "$GITHUB_ENV"

          echo "Hostname: $HN"
          echo "Runtime: $RT minutes"

      - name: Install dependencies
        run: |
          sudo apt-get update -y

          sudo apt-get install -y \
            xrdp \
            xfce4 \
            xfce4-terminal \
            xfce4-session \
            xfce4-goodies \
            xfconf \
            dbus \
            dbus-x11 \
            ufw \
            curl \
            wget \
            python3

      - name: Configure XFCE for XRDP
        run: |
          sudo systemctl stop xrdp 2>/dev/null || true
          sudo systemctl stop xrdp-sesman 2>/dev/null || true

          sudo mkdir -p /etc/xrdp

          sudo tee /etc/xrdp/startwm.sh > /dev/null <<'EOF'
          #!/bin/sh

          export LANG=C.UTF-8
          export LANGUAGE=C.UTF-8
          export LC_ALL=C.UTF-8

          unset DBUS_SESSION_BUS_ADDRESS
          unset XDG_RUNTIME_DIR

          export XDG_CONFIG_DIRS="/etc/xdg/xdg-xfce:/etc/xdg"
          export XDG_DATA_DIRS="/usr/local/share:/usr/share"

          if [ -r /etc/profile ]; then
              . /etc/profile
          fi

          if [ -r "$HOME/.profile" ]; then
              . "$HOME/.profile"
          fi

          exec dbus-run-session -- startxfce4
          EOF

          sudo chmod +x /etc/xrdp/startwm.sh

          echo "===== /etc/xrdp/startwm.sh ====="
          sudo cat /etc/xrdp/startwm.sh
          echo "================================"

          sudo tee /etc/X11/Xwrapper.config > /dev/null <<'EOF'
          allowed_users=anybody
          needs_root_rights=yes
          EOF

          sudo mkdir -p /etc/xrdp

          sudo systemctl enable xrdp
          sudo systemctl enable xrdp-sesman

          sudo systemctl start xrdp

          sleep 3

          if sudo systemctl is-active --quiet xrdp; then
            echo "xrdp: running"
          else
            echo "ERROR: xrdp failed"
            sudo systemctl status xrdp --no-pager || true
            sudo journalctl -u xrdp --no-pager -n 50 || true
            exit 1
          fi

      - name: Create RDP user
        run: |
          U="$RDP_USER"
          P="$RDP_PASS"

          if ! id "$U" >/dev/null 2>&1; then
            sudo useradd \
              --create-home \
              --shell /bin/bash \
              "$U"
          fi

          echo "$U:$P" | sudo chpasswd

          sudo usermod -aG sudo "$U"

          HOME_DIR="$(getent passwd "$U" | cut -d: -f6)"

          sudo tee "$HOME_DIR/.xsession" > /dev/null <<'EOF'
          #!/bin/sh

          export LANG=C.UTF-8
          export LANGUAGE=C.UTF-8
          export LC_ALL=C.UTF-8

          unset DBUS_SESSION_BUS_ADDRESS
          unset XDG_RUNTIME_DIR

          export XDG_CONFIG_DIRS="/etc/xdg/xdg-xfce:/etc/xdg"
          export XDG_DATA_DIRS="/usr/local/share:/usr/share"

          if [ -r "$HOME/.profile" ]; then
              . "$HOME/.profile"
          fi

          exec dbus-run-session -- startxfce4
          EOF

          sudo chmod +x "$HOME_DIR/.xsession"
          sudo chown "$U:$U" "$HOME_DIR/.xsession"

          echo "RDP user configured: $U"

      - name: Configure XRDP session
        run: |
          sudo tee /etc/xrdp/xrdp.ini >/dev/null <<'EOF'
          [Globals]
          ini_version=1

          [Logging]
          LogFile=xrdp.log
          LogLevel=INFO
          EnableSyslog=true
          SyslogLevel=INFO

          [Channels]
          rdpdr=true
          rdpsnd=true
          drdynvc=true
          cliprdr=true

          [Xorg]
          name=Xorg
          lib=libxup.so
          username=ask
          password=ask
          port=-1
          code=20
          EOF

          sudo systemctl restart xrdp

          sleep 3

          sudo systemctl is-active --quiet xrdp

          echo "XRDP restarted successfully."

      - name: Open RDP port
        run: |
          sudo ufw allow 3389/tcp || true
          echo "RDP port 3389 configured."

      - name: Purge old Tailscale devices
        if: ${{ needs.setup.outputs.multi == '0' && inputs.do_purge == 'true' }}
        run: |
          AUTH=$(printf '%s:' "${{ inputs.ts_api_key }}" | base64 -w0)

          TN=$(python3 -c '
          import urllib.parse
          import sys
          print(urllib.parse.quote(sys.argv[1], safe=""))
          ' "${{ inputs.ts_tailnet }}")

          DEVICES=$(curl -fsS \
            -H "Authorization: Basic $AUTH" \
            "https://api.tailscale.com/api/v2/tailnet/$TN/devices") || {
              echo "Warning: failed to retrieve Tailscale devices."
              exit 0
          }

          export DEVICES_JSON="$DEVICES"
          export TS_AUTH="$AUTH"

          python3 <<'PY'
          import json
          import os
          import urllib.request

          auth = os.environ["TS_AUTH"]
          data = json.loads(os.environ["DEVICES_JSON"])

          for device in data.get("devices", []):
              hostname = device.get("hostname", "")

              if not hostname.startswith("bullet"):
                  continue

              device_id = device.get("id")

              if not device_id:
                  continue

              url = f"https://api.tailscale.com/api/v2/device/{device_id}"

              request = urllib.request.Request(
                  url,
                  method="DELETE",
                  headers={
                      "Authorization": f"Basic {auth}"
                  }
              )

              try:
                  with urllib.request.urlopen(request, timeout=20):
                      print(f"Deleted: {hostname}")
              except Exception as exc:
                  print(f"Warning: could not delete {hostname}: {exc}")
          PY

          echo "Tailscale purge complete."

      - name: Install + connect Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sudo sh

          sudo tailscale logout 2>/dev/null || true

          sudo tailscale up \
            --authkey="${{ inputs.ts_authkey }}" \
            --hostname="$TS_HOSTNAME" \
            --accept-dns=true \
            --accept-routes=true

          IP4="$(sudo tailscale ip -4 2>/dev/null | head -n1)"

          if [[ -z "$IP4" ]]; then
            echo "ERROR: Tailscale IPv4 address not found."
            sudo tailscale status || true
            exit 1
          fi

          echo "TAILSCALE_IP=$IP4" >> "$GITHUB_ENV"

          echo
          echo "======================================"
          echo " RDP : $IP4:3389"
          echo " USER: $RDP_USER"
          echo "======================================"
          echo

      - name: Verify services
        run: |
          echo "===== XRDP ====="
          sudo systemctl is-active xrdp
          sudo systemctl status xrdp --no-pager -n 10 || true

          echo
          echo "===== XFCE ====="
          command -v startxfce4
          command -v xfce4-session
          command -v xfconfd
          command -v dbus-run-session

          echo
          echo "===== DISPLAY ====="
          echo "DISPLAY=$DISPLAY"

          echo
          echo "===== TAILSCALE ====="
          sudo tailscale status

      - name: Keep alive
        run: |
          END=$((SECONDS + RUNTIME_MINUTES * 60))

          while [ "$SECONDS" -lt "$END" ]; do
            REMAIN=$(( (END - SECONDS) / 60 ))

            echo "[RDP] $(date '+%H:%M:%S') | remaining: ${REMAIN}m | ${TAILSCALE_IP}:3389"

            sleep 60
          done

      - name: Dispatch next or stop
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CYCLES="${{ inputs.cycles }}"

          [[ "$CYCLES" =~ ^[0-9]+$ ]] || CYCLES=0

          if [[ "$CYCLES" -le 0 ]]; then
            echo "cycles=0, session finished."
            exit 0
          fi

          NEXT=$((CYCLES - 1))
          REPO="${{ github.repository }}"
          REF="${{ github.ref_name }}"

          if [[ "$NEXT" -le 0 ]]; then
            echo "Final cycle reached."

            curl -fsS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -d "{\"ref\":\"$REF\",\"inputs\":{\"ts_tailnet\":\"${{ inputs.ts_tailnet }}\",\"ts_api_key\":\"${{ inputs.ts_api_key }}\",\"base_prefix\":\"bullet\",\"max_count\":\"10\",\"dry_run\":\"false\"}}" \
              "https://api.github.com/repos/$REPO/actions/workflows/rdp-tailscale-stop.yml/dispatches"

            echo "Dispatched STOP workflow."
            exit 0
          fi

          PAYLOAD=$(python3 - <<PY
          import json

          payload = {
              "ts_authkey": "${{ inputs.ts_authkey }}",
              "ts_api_key": "${{ inputs.ts_api_key }}",
              "ts_tailnet": "${{ inputs.ts_tailnet }}",
              "do_purge": "${{ inputs.do_purge }}",
              "quick_test": "${{ inputs.quick_test }}",
              "runtime_minutes": "${{ inputs.runtime_minutes }}",
              "rdp_count": "${{ inputs.rdp_count }}",
              "cycles": str($NEXT)
          }

          print(json.dumps(payload))
          PY
          )

          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d "{\"ref\":\"$REF\",\"inputs\":$PAYLOAD}" \
            "https://api.github.com/repos/$REPO/actions/workflows/rdp-tailscale-ubuntu-clean.yml/dispatches"

          echo "Dispatched next cycle: $NEXT"
