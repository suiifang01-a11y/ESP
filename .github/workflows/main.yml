name: Generate AWG Config

on:
  workflow_dispatch:
    inputs:
      endpoint:
        description: "AWG Server Endpoint"
        required: true
        default: "103.235.72.131:16978"

      server_public_key:
        description: "Server PublicKey"
        required: true
        type: string

      preshared_key:
        description: "PresharedKey"
        required: true
        type: string

      client_count:
        description: "Jumlah config"
        required: true
        default: "3"
        type: string

      start_ip:
        description: "IP awal client"
        required: true
        default: "10.66.66.61"
        type: string

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Install AWG/WireGuard tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wireguard-tools zip

      - name: Generate configs
        env:
          ENDPOINT: ${{ inputs.endpoint }}
          SERVER_PUBKEY: ${{ inputs.server_public_key }}
          PSK: ${{ inputs.preshared_key }}
          COUNT: ${{ inputs.client_count }}
          START_IP: ${{ inputs.start_ip }}
        run: |
          set -e

          mkdir -p awg_configs

          echo "::add-mask::$SERVER_PUBKEY"
          echo "::add-mask::$PSK"

          IFS=. read -r A B C D <<< "$START_IP"

          for ((i=0; i<COUNT; i++)); do
            IP="$A.$B.$C.$((D+i))"

            PRIVATE_KEY=$(wg genkey)
            PUBLIC_KEY=$(echo "$PRIVATE_KEY" | wg pubkey)

            NAME="CLIENT_$((i+1))"

            cat > "awg_configs/${NAME}.conf" <<EOF
          [Interface]
          PrivateKey = $PRIVATE_KEY
          Address = ${IP}/24
          DNS = 1.1.1.1,8.8.8.8

          Jc = 4
          Jmin = 40
          Jmax = 70
          S1 = 50
          S2 = 100
          H1 = 2112615044
          H2 = 3641400900
          H3 = 4133943628
          H4 = 3466609064

          [Peer]
          PublicKey = $SERVER_PUBKEY
          PresharedKey = $PSK
          Endpoint = $ENDPOINT
          AllowedIPs = 0.0.0.0/0, ::/0
          PersistentKeepalive = 25
          EOF

            echo "=== $NAME ==="
            echo "Address : $IP"
            echo "PublicKey : $PUBLIC_KEY"
            echo
          done

          zip -r AWG_CONFIGS.zip awg_configs

      - name: Upload configs
        uses: actions/upload-artifact@v4
        with:
          name: AWG_CONFIGS
          path: AWG_CONFIGS.zip
