name: RDP + Tailscale + Ubuntu XFCE

on:
  workflow_dispatch:
    inputs:
      ts_tailnet:         { description: "Tailscale tailnet (e.g. you@gmail.com)", required: true }
      ts_api_key:         { description: "Tailscale API key (device admin, no Bearer)", required: true }
      ts_authkey:         { description: "Tailscale Auth key (reusable or ephemeral)", required: true }
      runtime_minutes:    { description: "Runtime (max 360; default 355 when not test)", required: false, default: "355" }

permissions:
  contents: read
  actions: write

defaults:
  run:
    shell: bash

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.mk.outputs.matrix }}
    steps:
      - id: mk
        run: |
          n=1
          inc=()
          for i in $(seq 1 $n); do
            inc+=("{\"id\": $i}")
          done
          matrix=$(jq -n --argjson include "$(printf '%s\n' "${inc[@]}" | jq -s .)" '{include: $include}')
          echo "matrix=$matrix" >> $GITHUB_OUTPUT

  rdp:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
      max-parallel: 1
    timeout-minutes: 370
    steps:
      - name: Install + Up Tailscale
        run: |
          if ! command -v tailscale &> /dev/null; then
            curl -fsSL https://pkgs.tailscale.com/stable/ubuntu/focal.gpg | sudo apt-key add -
            sudo apt-add-repository "deb https://pkgs.tailscale.com/stable/ubuntu focal main"
            sudo apt-get update
            sudo apt-get install -y tailscale
          fi
          tailscale logout
          tailscale up --authkey "${{ inputs.ts_authkey }}" --hostname "ubuntu-${{ matrix.id }}" --accept-dns=true --accept-routes=true
          ip4=$(tailscale ip -4 | head -n 1)
          echo "TAILSCALE_IP=$ip4" >> $GITHUB_ENV
          echo "Tailscale IPv4: $ip4"

      - name: Install XFCE and GUI tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xfce4 \
            xfce4-goodies \
            xfce4-terminal \
            xvfb \
            dbus-x11 \
            xrdp

      - name: Start virtual display
        run: |
          Xvfb :99 \
            -screen 0 1920x1080x24 \
            -ac \
            +extension GLX \
            +render \
            -noreset &
          sleep 3

      - name: Start XFCE
        env:
          DISPLAY: :99
        run: |
          dbus-launch \
            --exit-with-session \
            startxfce4 &
          sleep 10

      - name: Enable RDP
        run: |
          sudo systemctl enable xrdp
          sudo systemctl start xrdp
          sudo ufw allow 3389/tcp

      - name: Keep alive (to ${{ env.RUNTIME_MINUTES }} mins)
        run: |
          mins=${{ inputs.runtime_minutes }}
          end=$(date -d "+$mins minutes" +%s)
          while [ $(date +%s) -lt $end ]; do
            echo "Heartbeat $(date -u '+%H:%M:%S') ends at $(date -d "@$end" -u '+%H:%M:%S')"
            sleep 60
          done
