name: ubunturdp

on:
  workflow_dispatch:
    inputs:
      auth:
        description: 'GRDP Authorization Code'
        required: true
        default: 'paste your code here'

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Creating User to Login
      run: |
         sudo useradd -m ash && sudo adduser ash sudo && echo 'ash:ash' | sudo chpasswd

    - name: Installing Desktop Environment (wait for 10 min)
      run: |
        sudo apt update -y
        sudo apt install -y expect ubuntu-desktop xfce4-terminal

    - name: Installing Chrome Remote Desktop and other tools
      run: |
            # Create a user for Chrome Remote Desktop
            sudo useradd -m Ubuntu
            sudo adduser Ubuntu sudo
            echo 'Ubuntu:1234' | sudo chpasswd
            sudo sed -i 's/.*:\/bin\/sh/&\/bin\/bash/' /etc/passwd

            # Install Chrome Remote Desktop
            wget https://dl.google.com/linux/direct/chrome-remote-desktop_current_amd64.deb
            sudo dpkg --install chrome-remote-desktop_current_amd64.deb
            sudo apt --assume-yes --fix-broken install

            # Configure Chrome Remote Desktop session
            sudo bash -c 'echo "exec /etc/X11/Xsession /usr/bin/xfce4-session" > /etc/chrome-remote-desktop-session'
            sudo apt install --assume-yes xscreensaver

            # Disable display manager if it interferes
            sudo systemctl disable lightdm.service || true

            # Install Google Chrome
            wget https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            sudo dpkg --install google-chrome-stable_current_amd64.deb
            sudo apt --assume-yes --fix-broken install
            sudo apt update && sudo apt -f install

            # Install Python and necessary libraries
            sudo apt install -y python3-pip xvfb
            pip3 install nbformat gdown pika

            # Install essential utilities
            sudo apt install -y nautilus nano

            # Install Visual Studio Code
            wget -O code.deb https://code.visualstudio.com/sha/download\?build\=stable\&os\=linux-deb-x64
            sudo dpkg --install code.deb
            sudo apt --assume-yes --fix-broken install

            # Install Node Version Manager (nvm) and Node.js
            wget -O- https://raw.githubusercontent.com/nvm-sh/nvm/master/install.sh | bash
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            nvm install --lts # Installs the latest LTS version of Node.js
            nvm use --lts

            # Add the Ubuntu user to the chrome-remote-desktop group
            sudo adduser Ubuntu chrome-remote-desktop

    - name: Generate GRDP setup script
      run: |
           echo "${{ github.event.inputs.auth }}" > setup.sh
           chmod 777 setup.sh

    - name: Initialize GRDP with PIN
      run: |
           expect -c '
           spawn ./setup.sh
           expect "Enter a PIN of at least six digits: "
           send "123456\r"
           expect "Enter the same PIN again: "
           send "123456\r"
           expect eof
           '

    - name: SSH tunnel over ngrok
      uses: joshlarsen/ssh-tunnel-action@v1.2
      with:
        # You might need to set your ngrok authtoken as a GitHub secret
        # For example, set a secret named NGROK_AUTHTOKEN in your repository settings
        # and reference it here:
        # ngrok_authtoken: ${{ secrets.NGROK_AUTHTOKEN }}
        # If you don't provide an authtoken, ngrok will use anonymous mode (limited)
        # ngrok_authtoken: "" # Uncomment and set your token if you have one
        remote_port: 22 # Assuming SSH is on port 22 on the runner
        # You can specify a subdomain for your ngrok tunnel if you have a paid ngrok account
        # subdomain: "my-custom-subdomain"
