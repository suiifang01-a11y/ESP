name: RDP + Tailscale (Ubuntu)

on:
  workflow_dispatch:
    inputs:
      ts_authkey:
        description: "Tailscale Auth key (tskey-auth-...)"
        required: true
      ts_api_key:
        description: "Tailscale API key (untuk purge device lama)"
        required: true
      ts_tailnet:
        description: "Tailscale tailnet (e.g. you@gmail.com)"
        required: true
      do_purge:
        description: "Purge device bullet* lama di Tailscale sebelum mulai"
        required: false
        default: "true"
      quick_test:
        description: "Mode test 5 menit"
        type: boolean
        default: false
      runtime_minutes:
        description: "Durasi session (maks 355)"
        required: false
        default: "355"
      rdp_count:
        description: "Jumlah instance RDP (1-10)"
        required: false
        default: "1"
      cycles:
        description: "0=stop setelah run ini; N=jumlah handoff tersisa"
        required: false
        default: "0"

permissions:
  contents: read
  actions: write

defaults:
  run:
    shell: bash

jobs:
  # ─── Job 1: Hitung matrix ───────────────────────────────────────────────────
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.mk.outputs.matrix }}
      multi:  ${{ steps.mk.outputs.multi }}
    steps:
      - id: mk
        run: |
          N=${{ inputs.rdp_count }}
          [[ "$N" -lt 1 ]] 2>/dev/null && N=1
          [[ "$N" -gt 10 ]] 2>/dev/null && N=10

          INCLUDE="["
          for i in $(seq 1 $N); do
            [[ $i -gt 1 ]] && INCLUDE="${INCLUDE},"
            INCLUDE="${INCLUDE}{\"id\":$i}"
          done
          INCLUDE="${INCLUDE}]"

          echo "matrix={\"include\":${INCLUDE}}" >> "$GITHUB_OUTPUT"
          [[ "$N" -gt 1 ]] && echo "multi=1" >> "$GITHUB_OUTPUT" \
                            || echo "multi=0" >> "$GITHUB_OUTPUT"

  # ─── Job 2: Setup RDP per instance ──────────────────────────────────────────
  rdp:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
      max-parallel: 10
    timeout-minutes: 370
    env:
      RDP_USER: bulletuser
      RDP_PASS: Bullet@12345
      DEBIAN_FRONTEND: noninteractive

    steps:
      # ── 1. Tentukan hostname + runtime ────────────────────────────────────────
      - name: Set hostname + runtime
        run: |
          N="${{ inputs.rdp_count }}"
          [[ "$N" -gt 1 ]] 2>/dev/null \
            && HN="bullet${{ matrix.id }}" \
            || HN="bullet"
          echo "TS_HOSTNAME=$HN" >> "$GITHUB_ENV"

          RT="${{ inputs.runtime_minutes }}"
          [[ "${{ inputs.quick_test }}" == "true" ]] && RT=5
          [[ ! "$RT" =~ ^[0-9]+$ ]]  && RT=355
          [[ "$RT" -lt 6 ]]           && RT=355
          [[ "$RT" -gt 355 ]]         && RT=355
          echo "RUNTIME_MINUTES=$RT" >> "$GITHUB_ENV"
          echo "Hostname: $HN | Runtime: $RT min"

      # ── 2. Install semua package sekaligus ────────────────────────────────────
      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            xrdp \
            xfce4 \
            xfce4-terminal \
            xfce4-goodies \
            dbus-x11 \
            ufw \
            curl \
            wget \
            python3

      # ── 3. Konfigurasi xrdp + xfce4 (proven pattern) ─────────────────────────
      - name: Configure xrdp + xfce4
        run: |
          # startwm.sh: comment out 2 baris default, append startxfce4
          sudo sed -i 's|^test -x /etc/X11/Xsession.*|#&|' /etc/xrdp/startwm.sh
          sudo sed -i 's|^exec /bin/sh /etc/X11/Xsession.*|#&|' /etc/xrdp/startwm.sh
          grep -q 'startxfce4' /etc/xrdp/startwm.sh \
            || echo 'startxfce4' | sudo tee -a /etc/xrdp/startwm.sh > /dev/null

          # Allowed users: anybody (bukan hanya console)
          echo 'allowed_users=anybody' | sudo tee /etc/X11/Xwrapper.config > /dev/null

          # Polkit fix — tanpa ini session langsung disconnect di beberapa env
          sudo mkdir -p /etc/polkit-1/localauthority/50-local.d/
          sudo tee /etc/polkit-1/localauthority/50-local.d/xrdp-allow.pkla > /dev/null << 'PKLA'
          [Allow RDP users colord]
          Identity=unix-group:sudo
          Action=org.freedesktop.color-manager.create-device;org.freedesktop.color-manager.create-profile;org.freedesktop.color-manager.delete-device;org.freedesktop.color-manager.delete-profile;org.freedesktop.color-manager.modify-device;org.freedesktop.color-manager.modify-profile
          ResultAny=no
          ResultInactive=no
          ResultActive=yes
          PKLA

          sudo systemctl enable xrdp
          sudo systemctl restart xrdp
          sleep 3
          sudo systemctl is-active xrdp \
            && echo "xrdp: running" \
            || { echo "ERROR: xrdp failed to start"; sudo journalctl -u xrdp --no-pager -n 30; exit 1; }

      # ── 4. Buat user RDP ──────────────────────────────────────────────────────
      - name: Create RDP user
        run: |
          U="$RDP_USER"
          P="$RDP_PASS"

          if ! id "$U" &>/dev/null; then
            sudo useradd -m -s /bin/bash "$U"
          fi
          echo "$U:$P" | sudo chpasswd
          sudo usermod -aG sudo,xrdp "$U"

          # .xsession untuk user ini
          echo 'startxfce4' | sudo tee /home/$U/.xsession > /dev/null
          sudo chown $U:$U /home/$U/.xsession

          echo "RDP user: $U | pass: $P"

      # ── 5. Buka port RDP via ufw ──────────────────────────────────────────────
      - name: Open RDP port
        run: |
          sudo ufw allow 3389/tcp || true
          echo "Port 3389 opened."

      # ── 6. Purge device bullet* lama (single-instance saja) ───────────────────
      - name: Purge old Tailscale devices
        if: ${{ needs.setup.outputs.multi == '0' && inputs.do_purge == 'true' }}
        run: |
          AUTH=$(echo -n "${{ inputs.ts_api_key }}:" | base64 -w0)
          TN=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" \
               "${{ inputs.ts_tailnet }}")

          DEVICES=$(curl -sf \
            -H "Authorization: Basic $AUTH" \
            "https://api.tailscale.com/api/v2/tailnet/$TN/devices") || {
            echo "Warning: gagal fetch device list. Skip purge."; exit 0
          }

          echo "$DEVICES" | python3 - << 'PY'
          import sys, json, urllib.request
          data = json.load(sys.stdin)
          auth = "$AUTH"
          for d in data.get("devices", []):
              if d.get("hostname", "").startswith("bullet"):
                  req = urllib.request.Request(
                      f"https://api.tailscale.com/api/v2/device/{d['id']}",
                      method="DELETE",
                      headers={"Authorization": f"Basic {auth}"}
                  )
                  try:
                      urllib.request.urlopen(req)
                      print(f"Deleted: {d['hostname']}")
                  except Exception as e:
                      print(f"Warn: {e}")
          PY
          echo "Purge selesai."

      # ── 7. Install + connect Tailscale ────────────────────────────────────────
      - name: Install + connect Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sudo sh

          sudo tailscale logout 2>/dev/null || true
          sudo tailscale up \
            --authkey="${{ inputs.ts_authkey }}" \
            --hostname="$TS_HOSTNAME" \
            --accept-dns=true \
            --accept-routes=true \
            --ssh

          IP4=$(sudo tailscale ip -4 2>/dev/null | head -1)
          echo "TAILSCALE_IP=$IP4" >> "$GITHUB_ENV"
          echo "Tailscale IP: $IP4"
          echo "────────────────────────────────────────────────"
          echo "  RDP TARGET  : $IP4:3389"
          echo "  USER        : $RDP_USER"
          echo "  PASS        : $RDP_PASS"
          echo "  HOSTNAME    : $TS_HOSTNAME"
          echo "────────────────────────────────────────────────"

      # ── 8. Keep alive ─────────────────────────────────────────────────────────
      - name: Keep alive
        run: |
          END=$((SECONDS + RUNTIME_MINUTES * 60))
          while [ $SECONDS -lt $END ]; do
            REMAIN=$(( (END - SECONDS) / 60 ))
            echo "[RDP] $(date +%H:%M:%S) | sisa: ${REMAIN} menit | IP: ${TAILSCALE_IP} | host: ${TS_HOSTNAME}"
            sleep 60
          done

      # ── 9. Dispatch next cycle atau stop ──────────────────────────────────────
      - name: Dispatch next or stop
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CYCLES="${{ inputs.cycles }}"
          [[ ! "$CYCLES" =~ ^[0-9]+$ ]] && CYCLES=0

          if [[ "$CYCLES" -gt 0 ]]; then
            NEXT=$((CYCLES - 1))
            REPO="${{ github.repository }}"
            REF="${{ github.ref_name }}"
            HDR_AUTH="Authorization: Bearer $GH_TOKEN"
            HDR_ACCEPT="Accept: application/vnd.github+json"

            if [[ "$NEXT" -le 0 ]]; then
              # Trigger stop workflow
              curl -sf -X POST \
                -H "$HDR_AUTH" -H "$HDR_ACCEPT" \
                -d "{\"ref\":\"$REF\",\"inputs\":{\"ts_tailnet\":\"${{ inputs.ts_tailnet }}\",\"ts_api_key\":\"${{ inputs.ts_api_key }}\",\"base_prefix\":\"bullet\",\"max_count\":\"10\",\"dry_run\":\"false\"}}" \
                "https://api.github.com/repos/$REPO/actions/workflows/rdp-tailscale-stop.yml/dispatches"
              echo "Dispatched STOP."
            else
              # Handoff ke run berikutnya
              PAYLOAD=$(python3 -c "
          import json
          print(json.dumps({
            'ts_authkey':      '${{ inputs.ts_authkey }}',
            'ts_api_key':      '${{ inputs.ts_api_key }}',
            'ts_tailnet':      '${{ inputs.ts_tailnet }}',
            'do_purge':        '${{ inputs.do_purge }}',
            'quick_test':      '${{ inputs.quick_test }}',
            'runtime_minutes': '${{ inputs.runtime_minutes }}',
            'rdp_count':       '${{ inputs.rdp_count }}',
            'cycles':          str($NEXT)
          }))
          ")
              curl -sf -X POST \
                -H "$HDR_AUTH" -H "$HDR_ACCEPT" \
                -d "{\"ref\":\"$REF\",\"inputs\":$PAYLOAD}" \
                "https://api.github.com/repos/$REPO/actions/workflows/rdp-tailscale-ubuntu-clean.yml/dispatches"
              echo "Dispatched next run, cycles=$NEXT"
            fi
          else
            echo "cycles=0, session selesai."
          fi
