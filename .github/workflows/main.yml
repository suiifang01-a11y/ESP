name: Ubuntu AWG SSH

on:
  workflow_dispatch:
    inputs:
      awg_private_key:
        description: "PrivateKey client AWG untuk runner"
        required: true
        type: string
      awg_server_public_key:
        description: "PublicKey server AWG"
        required: true
        type: string
      awg_preshared_key:
        description: "PresharedKey"
        required: true
        type: string
      awg_address:
        description: "Address runner"
        required: true
        default: "10.66.66.61/24"
        type: string
      ssh_public_key:
        description: "SSH Public Key Termux"
        required: true
        type: string

jobs:
  runner:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Install SSH + WireGuard tools
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server wireguard-tools curl

          sudo systemctl enable ssh
          sudo systemctl start ssh

      - name: Setup SSH key
        env:
          SSH_PUBKEY: ${{ inputs.ssh_public_key }}
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$SSH_PUBKEY" \
            > "$HOME/.ssh/authorized_keys"

          chmod 600 "$HOME/.ssh/authorized_keys"

      - name: Setup AWG config
        env:
          PRIVATE_KEY: ${{ inputs.awg_private_key }}
          SERVER_PUBLIC_KEY: ${{ inputs.awg_server_public_key }}
          PSK: ${{ inputs.awg_preshared_key }}
          ADDRESS: ${{ inputs.awg_address }}
        run: |
          sudo mkdir -p /etc/wireguard

          sudo tee /etc/wireguard/awg0.conf > /dev/null <<EOF
          [Interface]
          PrivateKey = $PRIVATE_KEY
          Address = $ADDRESS
          DNS = 1.1.1.1,8.8.8.8

          Jc = 4
          Jmin = 40
          Jmax = 70
          S1 = 50
          S2 = 100
          H1 = 2112615044
          H2 = 3641400900
          H3 = 4133943628
          H4 = 3466609064

          [Peer]
          PublicKey = $SERVER_PUBLIC_KEY
          PresharedKey = $PSK
          Endpoint = 103.235.72.131:16978
          AllowedIPs = 0.0.0.0/0, ::/0
          PersistentKeepalive = 25
          EOF

          sudo chmod 600 /etc/wireguard/awg0.conf

      - name: Start AWG interface
        run: |
          sudo wg-quick up awg0 || true
          sleep 3

          echo "===== AWG ====="
          sudo wg show awg0 || true

          echo "===== SSH ====="
          echo "User: $(whoami)"
          echo "AWG:"
          ip -4 addr show awg0 || true

      - name: Keep runner alive
        run: |
          echo "Runner aktif selama job berjalan."
          sleep 21000
