name: Ubuntu AmneziaWG Server (Custom Config)

on:
  workflow_dispatch:
    inputs:
      runtime_minutes:
        description: "Runtime (max 360)"
        default: "355"
      server_port:
        description: "WG Port (contoh: 16978)"
        default: "16978"

env:
  RDP_USER: bullet
  RDP_PASS: Bullet@12345
  # Parameter AmneziaWG sama persis kayak config contoh
  JC: 4
  JMIN: 40
  JMAX: 70
  S1: 50
  S2: 100
  H1: 2112615044
  H2: 3641400900
  H3: 4133943628
  H4: 3466609064

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 370
    
    steps:
      - name: Install AmneziaWG + RDP
        run: |
          sudo apt update && sudo DEBIAN_FRONTEND=noninteractive apt install -y \
            wireguard-tools build-essential linux-headers-$(uname -r) \
            xfce4 xfce4-goodies xrdp dbus-x11 xorg qrencode curl
          
          # Install AmneziaWG
          cd /tmp
          wget -q https://github.com/amnezia-vpn/amneziawg-go/releases/latest/download/amneziawg-go-linux-amd64 -O amneziawg-go
          chmod +x amneziawg-go && sudo mv amneziawg-go /usr/local/bin/
          
          git clone https://github.com/amnezia-vpn/amneziawg-tools.git
          cd amneziawg-tools/src && make && sudo make install

      - name: Setup Server
        run: |
          # Enable IP forwarding
          echo 'net.ipv4.ip_forward=1' | sudo tee -a /etc/sysctl.conf
          sudo sysctl -p
          
          cd /etc/wireguard
          
          # Generate keypair
          SERVER_PRIV=$(sudo wg genkey | tee privatekey)
          SERVER_PUB=$(echo "$SERVER_PRIV" | sudo wg pubkey | tee publickey)
          
          # Generate client keypair
          CLIENT_PRIV=$(sudo wg genkey | tee client-privatekey)
          CLIENT_PUB=$(echo "$CLIENT_PRIV" | sudo wg pubkey | tee client-publickey)
          
          # Generate PresharedKey (untuk extra security)
          PSK=$(sudo wg genpsk | tee presharedkey)
          
          SERVER_IP=$(curl -s ifconfig.me)
          WG_PORT=${{ inputs.server_port }}
          
          # Server config (wg0.conf)
          sudo tee wg0.conf << EOF
          [Interface]
          PrivateKey = $SERVER_PRIV
          Address = 10.66.66.1/24
          ListenPort = $WG_PORT
          DNS = 1.1.1.1, 8.8.8.8
          Jc = $JC
          Jmin = $JMIN
          Jmax = $JMAX
          S1 = $S1
          S2 = $S2
          H1 = $H1
          H2 = $H2
          H3 = $H3
          H4 = $H4
          
          [Peer]
          # Client
          PublicKey = $CLIENT_PUB
          PresharedKey = $PSK
          AllowedIPs = 10.66.66.61/32
          EOF
          
          # Client config (format sama persis kayak contoh)
          CLIENT_CONFIG="[Interface]
          PrivateKey = $CLIENT_PRIV
          Address = 10.66.66.61/24
          DNS = 1.1.1.1,8.8.8.8
          
          Jc = $JC
          Jmin = $JMIN
          Jmax = $JMAX
          S1 = $S1
          S2 = $S2
          H1 = $H1
          H2 = $H2
          H3 = $H3
          H4 = $H4
          
          [Peer]
          PublicKey = $SERVER_PUB
          PresharedKey = $PSK
          Endpoint = $SERVER_IP:$WG_PORT
          AllowedIPs = 0.0.0.0/0, ::/0
          PersistentKeepalive = 25"
          
          # Save configs
          echo "$CLIENT_CONFIG" | sudo tee /tmp/client.conf
          
          # Start VPN
          sudo wg-quick up wg0
          
          # Setup NAT
          sudo iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE
          sudo iptables -A FORWARD -i wg0 -j ACCEPT
          sudo iptables -A FORWARD -o wg0 -j ACCEPT
          
          # Allow port
          sudo ufw allow $WG_PORT/udp 2>/dev/null || true

      - name: Setup RDP
        run: |
          # Create user
          sudo useradd -m -s /bin/bash $RDP_USER 2>/dev/null || true
          echo "$RDP_USER:$RDP_PASS" | sudo chpasswd
          sudo usermod -aG sudo $RDP_USER
          
          # Config XRDP
          echo "xfce4-session" | sudo tee /home/$RDP_USER/.xsession
          sudo chown $RDP_USER:$RDP_USER /home/$RDP_USER/.xsession
          sudo sed -i 's|test -x /etc/X11/Xsession && exec /etc/X11/Xsession|exec startxfce4|' /etc/xrdp/startwm.sh
          
          # Start RDP
          sudo systemctl restart xrdp
          sudo systemctl restart xrdp-sesman

      - name: Output Config
        run: |
          echo "========================================"
          echo "COPY INI KE FILE .conf DI ANDROID/PC:"
          echo "========================================"
          cat /tmp/client.conf
          echo ""
          echo "========================================"
          echo "QR CODE (SCAN PAKE AMNEZIAWG):"
          echo "========================================"
          cat /tmp/client.conf | qrencode -t ANSIUTF8
          echo ""
          echo "========================================"
          echo "RDP ACCESS (setelah VPN connect):"
          echo "========================================"
          echo "IP: 10.66.66.1"
          echo "User: $RDP_USER"
          echo "Pass: $RDP_PASS"
          echo "========================================"
          echo ""
          echo "Server Public IP: $(curl -s ifconfig.me)"
          echo "Port: ${{ inputs.server_port }}"

      - name: Keep Alive
        run: sleep $(( ${{ inputs.runtime_minutes }} * 60 ))
